<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you be my valentine my babyy Kagnchanaa?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Poppins", sans-serif; }
    body {
      background: linear-gradient(135deg, #52cce8, #e3f6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .container { text-align: center; }
    h1 { color: #ff6392; margin-bottom: 20px; }
    .gif-area { position: relative; display: flex; justify-content: center; align-items: center; gap: 60px; margin-bottom: 20px; }
    .gif { width: 220px; border-radius: 10px; }
    button {
      padding: 12px 28px; border-radius: 30px; border: none;
      color: white; font-size: 1.2rem; cursor: pointer;
      margin: 0 15px; transition: transform 0.2s;
    }
    .buttons {
      display: flex;
      justify-content: space-between; /* ensures NO is left, YES is right */
      align-items: center;
      height: 80px;
      padding: 0 20px; /* add gap from edges */
      position: relative;
    }
    #noBtn { background: #ff4b5c; position: relative; transition: transform 0.2s; }
    #yesBtn { background: #07c67b; position: relative; transition: transform 0.2s; }
    .love-screen { display: none; }
    .rose-left, .rose-right { width: 500px; height: 500px; opacity: 0; transform: scale(0); position: relative; }
    @keyframes roseFloat {
      0% { transform: scale(0) translateY(0); opacity: 0; }
      30% { transform: scale(1.2) translateY(-10px); opacity: 1; }
      70% { transform: scale(1) translateY(-40px); opacity: 1; }
      100% { transform: scale(1) translateY(-60px); opacity: 0.6; }
    }
    .rose-left.pop, .rose-right.pop { animation: roseFloat 5s ease forwards; }

    /* ======= Blue Heart Animation ======= */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #00bfff;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      pointer-events: none;
      animation: floatHeart 1s forwards;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #00bfff;
      border-radius: 50%;
    }
    .heart::before { top: -10px; left: 0; }
    .heart::after { left: 10px; top: 0; }
    @keyframes floatHeart {
      0% { transform: translate(-50%, -50%) scale(1) rotate(-45deg); opacity: 1; }
      50% { transform: translate(-50%, -150px) scale(1.2) rotate(-45deg); opacity: 0.7; }
      100% { transform: translate(-50%, -250px) scale(0) rotate(-45deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="question-screen" id="question">
      <img src="bubuGIF.gif" alt="cute gif" class="gif" />
      <h1>Do You Love Me Baby Kagnchana?</h1>
      <div class="buttons">
        <button id="noBtn">NO</button>
        <button id="yesBtn">YES</button>
      </div>
    </div>

    <div class="love-screen" id="love">
      <div class="gif-area">
        <img src="https://cdn.store-assets.com/s/761122/i/52940451.png" alt="rose left" class="rose-left" id="leftRose" />
        <img src="bubu_rubGIF.gif" alt="love gif" class="gif" />
        <img src="https://cdn.store-assets.com/s/761122/i/52940451.png" alt="rose right" class="rose-right" id="rightRose" />
      </div>
      <h1>Yay! ❤️ I love you too Baby Kagnchana!</h1>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const question = document.getElementById("question");
    const love = document.getElementById("love");
    const leftRose = document.getElementById("leftRose");
    const rightRose = document.getElementById("rightRose");

    const container = document.querySelector('.buttons');
    const originalPos = { top: 10, left: 130 };
    let returnTimeout;

    yesBtn.addEventListener("click", () => {
      question.style.display = "none";
      love.style.display = "block";
      leftRose.classList.add("pop");
      setTimeout(() => { rightRose.classList.add("pop"); }, 300);
      yesBtn.textContent = "💙 Yes! Forever!";
      setTimeout(() => { yesBtn.textContent = "Yes, I will! 💍"; }, 2500);

      // ===== Add multiple floating hearts =====
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.style.left = `${yesBtn.offsetLeft + yesBtn.offsetWidth/2 + (Math.random()*60-30)}px`;
        heart.style.top = `${yesBtn.offsetTop}px`;
        container.appendChild(heart);
        setTimeout(() => heart.remove(), 1000);
      }
    });

    function moveNoButton() {
      clearTimeout(returnTimeout);

      const containerRect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const maxX = containerRect.width - btnRect.width;
      const maxY = containerRect.height - btnRect.height;

      let randomX, randomY, distance;
      let attempts = 0;
      do {
        randomX = Math.random() * maxX;
        randomY = Math.random() * maxY;

        const noCenterX = randomX + btnRect.width / 2;
        const noCenterY = randomY + btnRect.height / 2;
        const yesCenterX = yesRect.left - containerRect.left + yesRect.width / 2;
        const yesCenterY = yesRect.top - containerRect.top + yesRect.height / 2;

        distance = Math.hypot(noCenterX - yesCenterX, noCenterY - yesCenterY);
        attempts++;
        if (attempts > 100) break;
      } while (distance < 100);

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      // Return NO button faster (0.1s)
      returnTimeout = setTimeout(() => {
        noBtn.style.transition = "all 0.1s ease";
        noBtn.style.left = `${originalPos.left}px`;
        noBtn.style.top = `${originalPos.top}px`;
        setTimeout(() => {
          noBtn.style.transition = "top 0.3s ease, left 0.3s ease, transform 0.2s ease";
        }, 100);
      }, 200);
    }

    ["mouseenter", "focus", "click", "touchstart"].forEach(evt => {
      noBtn.addEventListener(evt, moveNoButton);
    });
  </script>
</body>
</html>
